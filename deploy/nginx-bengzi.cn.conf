# =============================================================================
# www.bengzi.cn 生产 Nginx（HTTPS 在 8088，访问 https://www.bengzi.cn:8088/）
# =============================================================================
#
# 你贴的配置里需要改的点：
# 1) server_name 不能写端口。错误：server_name www.bengzi.cn:8088;
#    正确：server_name www.bengzi.cn;
# 2) 不能又让 Nginx listen 8088，又把 proxy_pass 指到 127.0.0.1:8088（与 Actix 抢同一端口）。
#    做法：Actix 改用其它端口，例如 BIND_ADDR=127.0.0.1:18088，Nginx 只负责在 8088 上终止 TLS 并反代到 18088。
# 3) 若第二段是 listen 443，则访问应是 https://www.bengzi.cn/（不带 :8088），且第一段不应再占用 8088 做纯跳转
#    （除非 Actix 已迁走）。
#
# 本文件采用：对外 8088 = HTTPS（ssl），后端 Actix = 127.0.0.1:18088
#
# .env：BIND_ADDR=127.0.0.1:18088
# 云安全组：放行 TCP 8088
#
# sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream actix_hd_backend {
    server 127.0.0.1:18088;
    keepalive 32;
}

# 可选：HTTP 80 跳到带端口的 HTTPS（按你实际对外端口改）
server {
    listen 80;
    listen [::]:80;
    server_name www.bengzi.cn bengzi.cn;
    return 301 https://www.bengzi.cn:8088$request_uri;
}

# 若仍需要「明文 8088 → 跳 HTTPS」，且与下面 ssl 8088 不冲突时：只能二选一监听 8088。
# 通常只保留下面 ssl 8088 即可，用户直接用 https:// 打开。

server {
    listen 8088 ssl http2;
    listen [::]:8088 ssl http2;
    server_name www.bengzi.cn bengzi.cn;

    ssl_certificate     /etc/ssl/certs/www.bengzi.cn.pem;
    ssl_certificate_key /etc/ssl/certs/www.bengzi.cn.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 50m;

    location / {
        proxy_pass http://actix_hd_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

