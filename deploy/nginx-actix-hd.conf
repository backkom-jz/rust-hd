# 站点：反代到本机 Actix（127.0.0.1:8088）
# 安装：sudo cp deploy/nginx-actix-hd.conf /etc/nginx/sites-available/actix-hd
#       sudo ln -sf /etc/nginx/sites-available/actix-hd /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 前提：actix-hd 的 BIND_ADDR=127.0.0.1:8088（只本机访问，由 Nginx 对外）

upstream actix_hd_backend {
    server 127.0.0.1:8088;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    # 若有域名，可改为 your.domain.com 并申请证书开 HTTPS
    server_name 47.116.213.182;

    client_max_body_size 2m;

    location / {
        proxy_pass http://actix_hd_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

