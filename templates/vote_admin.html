<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>投票管理</title>
  <link rel="stylesheet" href="/static/css/site.css" />
  <style>
    .admin-wrap { width: 100%; max-width: 900px; }
    .admin-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 860px) {
      .admin-grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 1.1rem;
    }
    .panel h1, .panel h2 { margin: 0 0 0.75rem; }
    .panel h1 { font-size: 1.3rem; }
    .panel h2 { font-size: 1.02rem; color: var(--accent); }
    .field { margin-bottom: 0.75rem; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.28rem;
    }
    .field input, .field textarea {
      width: 100%;
      font: inherit;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .field textarea { min-height: 120px; resize: vertical; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .msg {
      display: none;
      margin-top: 0.7rem;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      font-size: 0.86rem;
    }
    .msg.show { display: block; }
    .msg.err { background: #fde8e8; color: #8b1e1e; border: 1px solid #f5b5b5; }
    .msg.ok { background: #e8f5ee; color: #14532d; border: 1px solid #a7e0bf; }
    .status-pill {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      margin-left: 0.35rem;
    }
    .status-pill.closed { background: #eee; color: #666; }
    .bar-row { margin: 0.55rem 0; }
    .bar-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.86rem;
      margin-bottom: 0.22rem;
      gap: 0.4rem;
    }
    .bar-track {
      height: 10px;
      border-radius: 999px;
      background: #e8ecf2;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #1a56c4, #3d7fd9);
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .hist-item {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      align-items: center;
      padding: 0.55rem 0.2rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.86rem;
      cursor: pointer;
    }
    .hist-item:hover { background: #f7f9fc; }
    .hist-item:last-child { border-bottom: none; }
    .hint { font-size: 0.8rem; color: var(--muted); margin: 0 0 0.75rem; line-height: 1.45; }
    .nav-mini { font-size: 0.84rem; margin-bottom: 0.85rem; }
    .nav-mini a { color: var(--accent); text-decoration: none; font-weight: 600; }
    button.warn {
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 1.1rem;
      background: #f3e6ec;
      color: #8a3a5c;
    }
  </style>
</head>
<body class="has-hero-bg">
  <div class="site-shell">
    <div class="admin-wrap">
      <div class="nav-mini">
        <a href="/">← 返回首页</a> ·
        <a href="/vote">用户投票页</a>
      </div>

      <div class="admin-grid">
        <section class="panel">
          <h1>创建 / 结束投票</h1>
          <p class="hint">无鉴权管理页，请勿外传链接。同时仅一场进行中；结束后归档，再开新场。</p>
          <div class="field">
            <label for="title">标题</label>
            <input id="title" type="text" maxlength="80" placeholder="例如：今晚团建地点投票" />
          </div>
          <div class="field">
            <label for="options">选项（每行一个，至少 2 个）</label>
            <textarea id="options" placeholder="选项 A&#10;选项 B&#10;选项 C"></textarea>
          </div>
          <div class="actions">
            <button class="primary" type="button" id="createBtn">开启本场</button>
            <button class="warn" type="button" id="closeBtn">结束本场</button>
            <button class="primary" type="button" id="refreshBtn" style="background:#3a4555;">刷新结果</button>
          </div>
          <div class="msg" id="msg"></div>
        </section>

        <section class="panel">
          <h2>实时结果 <span class="status-pill hidden" id="statusPill"></span></h2>
          <p class="hint" id="resultHint">暂无数据</p>
          <div id="resultBars"></div>
        </section>
      </div>

      <section class="panel" style="margin-top:1rem;">
        <h2>历史场次</h2>
        <p class="hint">点击某场可查看归档结果。</p>
        <div id="history"></div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const titleEl = document.getElementById("title");
      const optionsEl = document.getElementById("options");
      const createBtn = document.getElementById("createBtn");
      const closeBtn = document.getElementById("closeBtn");
      const refreshBtn = document.getElementById("refreshBtn");
      const msg = document.getElementById("msg");
      const resultBars = document.getElementById("resultBars");
      const resultHint = document.getElementById("resultHint");
      const statusPill = document.getElementById("statusPill");
      const historyEl = document.getElementById("history");
      let busy = false;
      let viewingPollId = null;

      function showMsg(text, ok) {
        msg.textContent = text || "";
        msg.className = "msg" + (text ? " show " + (ok ? "ok" : "err") : "");
      }

      function escapeHtml(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      async function api(path, opts) {
        const res = await fetch(path, Object.assign({
          headers: { "Content-Type": "application/json" },
        }, opts || {}));
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || ("请求失败 " + res.status));
        return data;
      }

      function renderResults(data) {
        viewingPollId = data.id;
        statusPill.classList.remove("hidden");
        statusPill.textContent = data.status === "open" ? "进行中" : "已结束";
        statusPill.classList.toggle("closed", data.status !== "open");
        resultHint.textContent =
          data.title + " · 共 " + data.total_votes + " 票 · #" + data.id;
        const total = data.total_votes || 0;
        resultBars.innerHTML = data.options.map(function (o) {
          const pct = total > 0 ? Math.round((o.votes * 1000) / total) / 10 : 0;
          return (
            '<div class="bar-row">' +
              '<div class="bar-top"><span>' + escapeHtml(o.label) +
              "</span><span>" + o.votes + " · " + pct + "%</span></div>" +
              '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
            "</div>"
          );
        }).join("");
      }

      function renderHistory(polls) {
        if (!polls.length) {
          historyEl.innerHTML = '<p class="hint">暂无历史</p>';
          return;
        }
        historyEl.innerHTML = polls.map(function (p) {
          return (
            '<div class="hist-item" data-id="' + p.id + '">' +
              "<div><strong>" + escapeHtml(p.title) + "</strong>" +
              '<div style="color:var(--muted);font-size:0.78rem;">#' + p.id +
              " · " + p.created_at +
              (p.closed_at ? " → " + p.closed_at : "") +
              "</div></div>" +
              "<div>" + p.total_votes + " 票 · " +
              (p.status === "open" ? "进行中" : "已结束") + "</div>" +
            "</div>"
          );
        }).join("");
        historyEl.querySelectorAll(".hist-item").forEach(function (el) {
          el.addEventListener("click", async function () {
            const id = el.getAttribute("data-id");
            try {
              const data = await api("/api/vote/admin/results?poll_id=" + id);
              renderResults(data);
              showMsg("已加载场次 #" + id, true);
            } catch (e) {
              showMsg(e.message || "加载失败", false);
            }
          });
        });
      }

      async function refreshAll() {
        const hist = await api("/api/vote/admin/history");
        renderHistory(hist.polls || []);
        try {
          const q = viewingPollId ? ("?poll_id=" + viewingPollId) : "";
          const data = await api("/api/vote/admin/results" + q);
          renderResults(data);
        } catch (_) {
          resultHint.textContent = "暂无投票场次";
          resultBars.innerHTML = "";
          statusPill.classList.add("hidden");
        }
      }

      createBtn.addEventListener("click", async function () {
        if (busy) return;
        const title = titleEl.value.trim();
        const options = optionsEl.value.split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
        busy = true;
        createBtn.disabled = true;
        showMsg("", false);
        try {
          const poll = await api("/api/vote/admin/polls", {
            method: "POST",
            body: JSON.stringify({ title: title, options: options }),
          });
          showMsg("已开启投票 #" + poll.id, true);
          viewingPollId = poll.id;
          titleEl.value = "";
          optionsEl.value = "";
          await refreshAll();
        } catch (e) {
          showMsg(e.message || "创建失败", false);
        } finally {
          busy = false;
          createBtn.disabled = false;
        }
      });

      closeBtn.addEventListener("click", async function () {
        if (busy) return;
        if (!confirm("确认结束当前进行中的投票？结束后可开新场。")) return;
        busy = true;
        closeBtn.disabled = true;
        try {
          const data = await api("/api/vote/admin/close", { method: "POST", body: "{}" });
          showMsg("已结束投票 #" + data.id, true);
          viewingPollId = data.id;
          await refreshAll();
        } catch (e) {
          showMsg(e.message || "结束失败", false);
        } finally {
          busy = false;
          closeBtn.disabled = false;
        }
      });

      refreshBtn.addEventListener("click", async function () {
        try {
          await refreshAll();
          showMsg("已刷新", true);
        } catch (e) {
          showMsg(e.message || "刷新失败", false);
        }
      });

      refreshAll().catch(function (e) {
        showMsg(e.message || "加载失败", false);
      });
    })();
  </script>
</body>
</html>
