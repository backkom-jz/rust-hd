<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="开放签到 — 无需位置校验，可快速提交签到，同手机号每日一次" />
  <title>开放签到</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      color: #14241f;
      background: #4a7c6b url("/static/img/jy_0401_02.png") center / cover no-repeat fixed;
    }
    .overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: linear-gradient(165deg, rgba(255,255,255,0.1) 0%, rgba(18, 55, 42, 0.42) 100%);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 1.65rem 1.5rem 1.85rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.93);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 56px rgba(15, 45, 35, 0.28), 0 0 0 1px rgba(255,255,255,0.55) inset;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .pin {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 12px;
      background: linear-gradient(145deg, #2563eb, #1d4ed8);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f3d2e;
      letter-spacing: 0.03em;
    }
    .sub { margin: 0.4rem 0 1rem; font-size: 0.84rem; color: #3d5c50; line-height: 1.45; }
    nav { margin-bottom: 0.85rem; font-size: 0.88rem; }
    nav a {
      color: #1d6b52;
      text-decoration: none;
      font-weight: 600;
    }
    nav a:hover { text-decoration: underline; }
    nav .home-link { color: #0f4d3a; font-weight: 700; }
    label { display: block; font-size: 0.8rem; margin-bottom: 0.35rem; color: #355848; font-weight: 600; }
    input {
      width: 100%;
      padding: 0.62rem 0.78rem;
      border: 1px solid rgba(30, 90, 70, 0.22);
      border-radius: 11px;
      font-size: 1rem;
      margin-bottom: 0.9rem;
      background: rgba(255,255,255,0.97);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #2a8f6a;
      box-shadow: 0 0 0 3px rgba(42, 143, 106, 0.2);
    }
    .geo-panel {
      border-radius: 12px;
      border: 1px dashed rgba(37, 99, 235, 0.28);
      background: rgba(248, 250, 255, 0.88);
      padding: 0.55rem 0.7rem;
      margin-bottom: 0.85rem;
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.45;
    }
    .geo-panel.muted { color: #94a3b8; border-style: solid; border-color: rgba(148, 163, 184, 0.45); }
    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.15rem;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(29, 78, 216, 0.35);
      transition: transform 0.1s, filter 0.15s;
    }
    button[type="submit"]:hover { filter: brightness(1.06); }
    button[type="submit"]:active { transform: scale(0.99); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
    .msg { margin-top: 1rem; padding: 0.75rem 0.85rem; border-radius: 12px; font-size: 0.9rem; display: none; line-height: 1.45; }
    .msg.ok { display: block; background: rgba(220, 252, 231, 0.95); color: #14532d; border: 1px solid #86efac; }
    .msg.err { display: block; background: rgba(254, 226, 226, 0.95); color: #7f1d1d; border: 1px solid #fca5a5; }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="card">
      <nav><a href="/" class="home-link">← 返回首页</a> · <a href="/stats">统计</a> · <a href="/checkin">围栏签到</a> · <a href="/iching">周易抽签</a> · <a href="/lottery">抽奖轮盘</a></nav>
      <div class="brand">
        <div class="pin" aria-hidden="true">✓</div>
        <h1>开放签到</h1>
      </div>
      <p class="sub">不校验距离；可不定位。每号每日一次。</p>
      <div id="geoPanel" class="geo-panel muted">定位：尝试中…</div>
      <form id="form">
        <label for="phone">手机号</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="手机号" required />
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="name" placeholder="用户名" required />
        <button type="submit" id="btn">提交</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
  </div>
  <script>
    (function () {
      let centerLat = 31.1569;
      let centerLng = 121.4746;
      let pos = null;
      const geoPanel = document.getElementById('geoPanel');
      const btn = document.getElementById('btn');

      fetch('/api/checkins/fence')
        .then((r) => (r.ok ? r.json() : {}))
        .then((j) => {
          if (typeof j.center_lat === 'number') centerLat = j.center_lat;
          if (typeof j.center_lng === 'number') centerLng = j.center_lng;
        })
        .catch(() => {});

      function haversineKm(a, b, c, d) {
        const R = 6371;
        const x = (c - a) * Math.PI / 180;
        const y = (d - b) * Math.PI / 180;
        const s = Math.sin(x/2)**2 + Math.cos(a * Math.PI/180) * Math.cos(c * Math.PI/180) * Math.sin(y/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
      }

      function geoLine() {
        if (!pos) {
          geoPanel.classList.add('muted');
          geoPanel.textContent = '定位：未获取（可直接提交）';
          return;
        }
        geoPanel.classList.remove('muted');
        const d = haversineKm(pos.lat, pos.lng, centerLat, centerLng);
        geoPanel.textContent = '定位：已获取（约 ' + d.toFixed(1) + ' km）';
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (r) => {
            pos = { lat: r.coords.latitude, lng: r.coords.longitude };
            geoLine();
          },
          () => {
            pos = null;
            geoLine();
          },
          { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 }
        );
      } else {
        geoPanel.textContent = '定位：不支持（可直接提交）';
      }

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('msg');
        msg.className = 'msg';
        msg.textContent = '';
        btn.disabled = true;
        const phone = document.getElementById('phone').value.trim();
        const username = document.getElementById('username').value.trim();
        const body = { phone, username };
        if (pos) {
          body.latitude = pos.lat;
          body.longitude = pos.lng;
        }
        try {
          const res = await fetch('/api/checkins/open', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            msg.className = 'msg err';
            msg.textContent = data.error || '失败';
            btn.disabled = false;
            return;
          }
          msg.className = 'msg ok';
          let t = '已签到 ' + (data.signed_at || '');
          if (data.distance_km != null && Number.isFinite(Number(data.distance_km))) {
            t += ' · ' + Number(data.distance_km).toFixed(1) + ' km';
          }
          msg.textContent = t;
          document.getElementById('phone').value = '';
          document.getElementById('username').value = '';
        } catch {
          msg.className = 'msg err';
          msg.textContent = '网络错误';
        }
        btn.disabled = false;
      });
    })();
  </script>
</body>
</html>
