<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="六人抽色 — 录入名单轮流盲抽六色，一人一次，结果入库锁定" />
  <title>六人抽色</title>
  <style>
    :root {
      --ink: #1a1f2e;
      --muted: #5c6578;
      --line: rgba(26, 31, 46, 0.12);
      --panel: rgba(255, 255, 255, 0.94);
      --accent: #1e3a6e;
      --accent-2: #c45d8a;
      --bg0: #0f1729;
      --bg1: #1a2744;
      --c-white: #f4f2ef;
      --c-gray: #8b919c;
      --c-deep: #0a1633;
      --c-black: #12141a;
      --c-pink: #e891b5;
      --c-blue: #3d7fd9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(90% 70% at 12% -8%, rgba(61, 127, 217, 0.35), transparent 55%),
        radial-gradient(80% 60% at 92% 8%, rgba(232, 145, 181, 0.28), transparent 50%),
        linear-gradient(165deg, var(--bg1) 0%, var(--bg0) 55%, #0a1020 100%) fixed;
    }
    .shell {
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame {
      width: 100%;
      max-width: 720px;
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.38);
      padding: 1.15rem 1.1rem 1.25rem;
      overflow: hidden;
      position: relative;
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(
        90deg,
        var(--c-white),
        var(--c-gray),
        var(--c-deep),
        var(--c-black),
        var(--c-pink),
        var(--c-blue)
      );
    }
    nav { font-size: 0.84rem; margin-bottom: 0.65rem; }
    nav a { color: var(--accent); text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    h1 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: 0.06em;
      color: #142038;
    }
    .sub {
      margin: 0.35rem 0 1rem;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.9rem;
      background: linear-gradient(180deg, #fff, #f7f8fb);
    }
    .panel h2 {
      margin: 0 0 0.7rem;
      font-size: 1rem;
      color: var(--accent);
    }
    .name-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }
    @media (max-width: 560px) {
      .name-grid { grid-template-columns: 1fr; }
    }
    .name-field label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
      font-weight: 600;
    }
    .name-field input {
      width: 100%;
      border: 1px solid rgba(30, 58, 110, 0.22);
      border-radius: 10px;
      padding: 0.55rem 0.65rem;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
    }
    .name-field input:focus {
      border-color: #3d7fd9;
      box-shadow: 0 0 0 3px rgba(61, 127, 217, 0.18);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 0.62rem 1.15rem;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: transform 0.12s, filter 0.12s, opacity 0.12s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn.alt {
      background: #e8ecf4;
      color: var(--accent);
    }
    .btn.warn {
      background: #f3e6ec;
      color: #8a3a5c;
    }
    .msg {
      display: none;
      margin-top: 0.7rem;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      font-size: 0.86rem;
    }
    .msg.show { display: block; }
    .msg.err {
      background: #fde8e8;
      color: #8b1e1e;
      border: 1px solid #f5b5b5;
    }
    .msg.ok {
      background: #e8f5ee;
      color: #14532d;
      border: 1px solid #a7e0bf;
    }
    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.2rem 0 0.85rem;
    }
    .swatch {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid rgba(0,0,0,0.12);
      background: #fff;
      color: var(--ink);
      opacity: 0.38;
      transition: opacity 0.25s, transform 0.25s;
    }
    .swatch.left { opacity: 1; }
    .swatch .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.18);
      flex-shrink: 0;
    }
    .draw-hero {
      text-align: center;
      padding: 0.5rem 0 0.2rem;
    }
    .turn-label {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .turn-name {
      margin: 0.25rem 0 0.8rem;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #142038;
    }
    .reveal {
      min-height: 148px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.4rem 0 0.9rem;
      perspective: 900px;
    }
    .reveal-card {
      width: min(220px, 70vw);
      height: 132px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #fff;
      background: linear-gradient(145deg, #2a3550, #1a2338);
      box-shadow: 0 16px 36px rgba(15, 23, 41, 0.35);
      transform: rotateY(0deg);
      transition: transform 0.55s ease, background 0.35s ease, color 0.35s;
    }
    .reveal-card.spinning {
      animation: colorPulse 0.45s ease-in-out infinite alternate;
    }
    .reveal-card.show {
      transform: rotateY(360deg);
    }
    @keyframes colorPulse {
      from { filter: brightness(1); transform: scale(1); }
      to { filter: brightness(1.15); transform: scale(1.03); }
    }
    .board {
      margin-top: 0.75rem;
      display: grid;
      gap: 0.45rem;
    }
    .row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1.1fr;
      gap: 0.4rem;
      align-items: center;
      padding: 0.55rem 0.65rem;
      border-radius: 12px;
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .row .idx {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
    }
    .row .who { font-weight: 700; }
    .row .clr {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 700;
    }
    .row .clr .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15);
    }
    .row.pending { opacity: 0.55; }
    .row.pending .clr { color: var(--muted); font-weight: 500; }
    .row.active {
      border-color: rgba(61, 127, 217, 0.45);
      box-shadow: 0 0 0 2px rgba(61, 127, 217, 0.12);
    }
    .locked-banner {
      text-align: center;
      padding: 0.55rem 0.7rem;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(10,22,51,0.08), rgba(232,145,181,0.14));
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: 0.04em;
    }
    .hidden { display: none !important; }
    .ink-on-light { color: #1a1f2e !important; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="frame">
      <nav>
        <a href="/">← 返回首页</a> ·
        <a href="/lottery">抽奖轮盘</a> ·
        <a href="/iching">周易抽签</a>
      </nav>
      <h1>六人抽色</h1>
      <p class="sub">先录入 6 人名单，再按顺序盲抽。颜色仅六种：白、灰、深蓝、黑、粉、蓝。每人一次，抽完锁定入库。</p>

      <div class="swatches" id="swatches" aria-label="颜色池"></div>

      <section class="panel" id="setupPanel">
        <h2>录入名单</h2>
        <div class="name-grid" id="nameGrid"></div>
        <div class="actions">
          <button class="btn" type="button" id="startBtn">开始本批次</button>
        </div>
        <div class="msg" id="setupMsg"></div>
      </section>

      <section class="panel hidden" id="drawPanel">
        <div class="locked-banner hidden" id="lockedBanner">本批次已抽完并锁定</div>
        <div class="draw-hero" id="drawHero">
          <div class="turn-label" id="turnLabel">当前抽色</div>
          <div class="turn-name" id="turnName">—</div>
          <div class="reveal">
            <div class="reveal-card" id="revealCard">?</div>
          </div>
          <div class="actions" style="justify-content:center;">
            <button class="btn" type="button" id="drawBtn">盲抽颜色</button>
            <button class="btn warn" type="button" id="resetBtn">清空重来</button>
          </div>
        </div>
        <h2 style="margin-top:0.85rem;">本批结果</h2>
        <div class="board" id="board"></div>
        <div class="msg" id="drawMsg"></div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const COLORS = [
        { name: "白", hex: "#f4f2ef", ink: true },
        { name: "灰", hex: "#8b919c", ink: false },
        { name: "深蓝", hex: "#0a1633", ink: false },
        { name: "黑", hex: "#12141a", ink: false },
        { name: "粉", hex: "#e891b5", ink: false },
        { name: "蓝", hex: "#3d7fd9", ink: false },
      ];
      const HIDE_KEY = "colorDrawHideBatchId";

      const setupPanel = document.getElementById("setupPanel");
      const drawPanel = document.getElementById("drawPanel");
      const nameGrid = document.getElementById("nameGrid");
      const swatches = document.getElementById("swatches");
      const startBtn = document.getElementById("startBtn");
      const drawBtn = document.getElementById("drawBtn");
      const resetBtn = document.getElementById("resetBtn");
      const setupMsg = document.getElementById("setupMsg");
      const drawMsg = document.getElementById("drawMsg");
      const turnLabel = document.getElementById("turnLabel");
      const turnName = document.getElementById("turnName");
      const revealCard = document.getElementById("revealCard");
      const board = document.getElementById("board");
      const lockedBanner = document.getElementById("lockedBanner");
      const drawHero = document.getElementById("drawHero");

      let busy = false;
      let currentBatch = null;

      for (let i = 0; i < 6; i++) {
        const wrap = document.createElement("div");
        wrap.className = "name-field";
        wrap.innerHTML =
          '<label for="name' + i + '">第 ' + (i + 1) + " 人</label>" +
          '<input id="name' + i + '" type="text" maxlength="16" autocomplete="off" placeholder="输入姓名" />';
        nameGrid.appendChild(wrap);
      }

      function colorMeta(name) {
        return COLORS.find(function (c) { return c.name === name; }) || { name: name, hex: "#999", ink: false };
      }

      function renderSwatches(remaining) {
        const left = remaining || COLORS.map(function (c) { return c.name; });
        swatches.innerHTML = COLORS.map(function (c) {
          const on = left.indexOf(c.name) >= 0;
          return (
            '<span class="swatch' + (on ? " left" : "") + '">' +
              '<span class="dot" style="background:' + c.hex + '"></span>' +
              c.name +
            "</span>"
          );
        }).join("");
      }

      function showMsg(el, text, ok) {
        el.textContent = text || "";
        el.className = "msg" + (text ? " show " + (ok ? "ok" : "err") : "");
      }

      function setHidden(el, hidden) {
        el.classList.toggle("hidden", !!hidden);
      }

      function renderBoard(batch) {
        board.innerHTML = batch.members.map(function (m, i) {
          const pending = !m.color;
          const active = batch.status === "open" && batch.next_person === m.person_name;
          let clrHtml = '<span class="clr">待抽</span>';
          if (m.color) {
            const meta = colorMeta(m.color);
            clrHtml =
              '<span class="clr"><span class="dot" style="background:' + meta.hex + '"></span>' +
              m.color + "</span>";
          }
          return (
            '<div class="row' + (pending ? " pending" : "") + (active ? " active" : "") + '">' +
              '<span class="idx">#' + (i + 1) + "</span>" +
              '<span class="who">' + escapeHtml(m.person_name) + "</span>" +
              clrHtml +
            "</div>"
          );
        }).join("");
      }

      function escapeHtml(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      function applyRevealIdle() {
        revealCard.classList.remove("spinning", "show");
        revealCard.textContent = "?";
        revealCard.style.background = "linear-gradient(145deg, #2a3550, #1a2338)";
        revealCard.style.color = "#fff";
        revealCard.classList.remove("ink-on-light");
      }

      function paintReveal(colorName) {
        const meta = colorMeta(colorName);
        revealCard.classList.remove("spinning");
        revealCard.classList.add("show");
        revealCard.style.background = meta.hex;
        revealCard.style.color = meta.ink ? "#1a1f2e" : "#fff";
        revealCard.classList.toggle("ink-on-light", !!meta.ink);
        revealCard.textContent = colorName;
      }

      function showSetup() {
        currentBatch = null;
        setHidden(setupPanel, false);
        setHidden(drawPanel, true);
        renderSwatches(null);
        applyRevealIdle();
        showMsg(setupMsg, "", false);
        showMsg(drawMsg, "", false);
      }

      function showBatch(batch) {
        currentBatch = batch;
        const locked = batch.status === "locked";
        setHidden(setupPanel, true);
        setHidden(drawPanel, false);
        setHidden(lockedBanner, !locked);
        renderSwatches(batch.remaining_colors);
        renderBoard(batch);

        if (locked) {
          turnLabel.textContent = "批次已锁定";
          turnName.textContent = "全部抽完";
          drawBtn.disabled = true;
          drawBtn.textContent = "已抽完";
          const last = batch.members.slice().reverse().find(function (m) { return m.color; });
          if (last) paintReveal(last.color);
        } else {
          turnLabel.textContent = "当前抽色";
          turnName.textContent = batch.next_person || "—";
          drawBtn.disabled = !batch.next_person;
          drawBtn.textContent = "盲抽颜色";
        }
      }

      function shouldHideLocked(batch) {
        if (!batch || batch.status !== "locked") return false;
        const hideId = localStorage.getItem(HIDE_KEY);
        return hideId && String(batch.id) === String(hideId);
      }

      async function api(path, opts) {
        const res = await fetch(path, Object.assign({
          headers: { "Content-Type": "application/json" },
        }, opts || {}));
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) {
          throw new Error(data.error || ("请求失败 " + res.status));
        }
        return data;
      }

      async function refresh() {
        const data = await api("/api/color-draw/session");
        if (!data.batch || shouldHideLocked(data.batch)) {
          showSetup();
          return;
        }
        showBatch(data.batch);
      }

      startBtn.addEventListener("click", async function () {
        if (busy) return;
        const names = [];
        for (let i = 0; i < 6; i++) {
          names.push(document.getElementById("name" + i).value);
        }
        busy = true;
        startBtn.disabled = true;
        showMsg(setupMsg, "", false);
        try {
          localStorage.removeItem(HIDE_KEY);
          const batch = await api("/api/color-draw/session", {
            method: "POST",
            body: JSON.stringify({ names: names }),
          });
          showBatch(batch);
        } catch (e) {
          showMsg(setupMsg, e.message || "创建失败", false);
        } finally {
          busy = false;
          startBtn.disabled = false;
        }
      });

      drawBtn.addEventListener("click", async function () {
        if (busy || !currentBatch || currentBatch.status !== "open") return;
        busy = true;
        drawBtn.disabled = true;
        showMsg(drawMsg, "", false);
        applyRevealIdle();
        revealCard.classList.add("spinning");
        revealCard.textContent = "…";

        const delay = new Promise(function (r) { setTimeout(r, 900); });
        try {
          const [result] = await Promise.all([
            api("/api/color-draw/draw", { method: "POST", body: "{}" }),
            delay,
          ]);
          paintReveal(result.color);
          showMsg(drawMsg, result.person_name + " → " + result.color, true);
          showBatch(result.batch);
        } catch (e) {
          applyRevealIdle();
          showMsg(drawMsg, e.message || "抽色失败", false);
          try { await refresh(); } catch (_) {}
        } finally {
          busy = false;
          if (currentBatch && currentBatch.status === "open") {
            drawBtn.disabled = false;
          }
        }
      });

      resetBtn.addEventListener("click", async function () {
        if (busy) return;
        if (!confirm("清空后可录入下一批名单。当前批次会保留在数据库中。确定？")) return;
        busy = true;
        resetBtn.disabled = true;
        try {
          if (currentBatch) {
            localStorage.setItem(HIDE_KEY, String(currentBatch.id));
          }
          await api("/api/color-draw/reset", { method: "POST", body: "{}" });
          for (let i = 0; i < 6; i++) {
            document.getElementById("name" + i).value = "";
          }
          showSetup();
        } catch (e) {
          showMsg(drawMsg, e.message || "重置失败", false);
        } finally {
          busy = false;
          resetBtn.disabled = false;
        }
      });

      renderSwatches(null);
      refresh().catch(function (e) {
        showSetup();
        showMsg(setupMsg, e.message || "无法加载会话", false);
      });
    })();
  </script>
</body>
</html>
