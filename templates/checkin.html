<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户签到</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      color: #14241f;
      background: #6b9a7a url("/static/img/jy_0401_02.png") center / cover no-repeat fixed;
    }
    .overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(30,60,45,0.35) 100%);
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 1.85rem 1.75rem;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.9);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(20, 40, 30, 0.25), 0 0 0 1px rgba(255,255,255,0.5) inset;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.45rem;
      font-weight: 700;
      color: #1a4d3a;
      letter-spacing: 0.02em;
    }
    .sub { margin: 0 0 1.35rem; font-size: 0.88rem; color: #4a6b5e; }
    nav { margin-bottom: 1rem; font-size: 0.9rem; }
    nav a {
      color: #1d6b52;
      text-decoration: none;
      font-weight: 500;
    }
    nav a:hover { text-decoration: underline; }
    label { display: block; font-size: 0.82rem; margin-bottom: 0.4rem; color: #3d5c50; font-weight: 500; }
    input {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid rgba(30, 90, 70, 0.22);
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 1rem;
      background: rgba(255,255,255,0.95);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #2a8f6a;
      box-shadow: 0 0 0 3px rgba(42, 143, 106, 0.2);
    }
    button[type="submit"] {
      width: 100%;
      padding: 0.72rem;
      margin-top: 0.25rem;
      background: linear-gradient(135deg, #2a8f6a 0%, #1d6b52 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(29, 107, 82, 0.35);
      transition: transform 0.1s, box-shadow 0.15s;
    }
    button[type="submit"]:hover {
      box-shadow: 0 6px 20px rgba(29, 107, 82, 0.4);
    }
    button[type="submit"]:active { transform: scale(0.99); }
    button[type="submit"]:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .msg { margin-top: 1rem; padding: 0.75rem 0.85rem; border-radius: 10px; font-size: 0.9rem; display: none; }
    .msg.ok { display: block; background: rgba(220, 252, 231, 0.95); color: #14532d; border: 1px solid #86efac; }
    .msg.err { display: block; background: rgba(254, 226, 226, 0.95); color: #7f1d1d; border: 1px solid #fca5a5; }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="card">
      <nav><a href="/stats">查看签到统计</a></nav>
      <h1>每日签到</h1>
      <p class="sub">填写手机号与用户名完成签到</p>
      <form id="form">
        <label for="phone">手机号</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="请输入手机号" required />
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="name" placeholder="请输入用户名" required />
        <button type="submit" id="btn">提交签到</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
  </div>
  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/api/checkins', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: document.getElementById('phone').value.trim(),
            username: document.getElementById('username').value.trim(),
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          msg.className = 'msg err';
          msg.textContent = data.error || '签到失败';
          return;
        }
        msg.className = 'msg ok';
        msg.textContent = '签到成功！时间：' + (data.signed_at || '');
        form.reset();
      } catch {
        msg.className = 'msg err';
        msg.textContent = '网络错误，请稍后重试';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
