<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>现场签到</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      color: #14241f;
      background: #4a7c6b url("/static/img/jy_0401_02.png") center / cover no-repeat fixed;
    }
    .overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: linear-gradient(165deg, rgba(255,255,255,0.1) 0%, rgba(18, 55, 42, 0.42) 100%);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 1.65rem 1.5rem 1.85rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.93);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 56px rgba(15, 45, 35, 0.28), 0 0 0 1px rgba(255,255,255,0.55) inset;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .pin {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 12px;
      background: linear-gradient(145deg, #1d6b52, #2a9d74);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 4px 12px rgba(29, 107, 82, 0.35);
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f3d2e;
      letter-spacing: 0.03em;
    }
    .sub { margin: 0.4rem 0 1rem; font-size: 0.84rem; color: #3d5c50; line-height: 1.45; }
    .fence {
      font-size: 0.8rem;
      color: #1a4d3aea;
      background: linear-gradient(90deg, rgba(42, 157, 116, 0.12), rgba(29, 107, 82, 0.08));
      border: 1px solid rgba(29, 107, 82, 0.2);
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
      margin-bottom: 1.1rem;
      line-height: 1.5;
    }
    .fence strong { color: #14523d; }
    nav { margin-bottom: 0.85rem; font-size: 0.88rem; }
    nav a {
      color: #1d6b52;
      text-decoration: none;
      font-weight: 600;
    }
    nav a:hover { text-decoration: underline; }
    label { display: block; font-size: 0.8rem; margin-bottom: 0.35rem; color: #355848; font-weight: 600; }
    input {
      width: 100%;
      padding: 0.62rem 0.78rem;
      border: 1px solid rgba(30, 90, 70, 0.22);
      border-radius: 11px;
      font-size: 1rem;
      margin-bottom: 0.9rem;
      background: rgba(255,255,255,0.97);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #2a8f6a;
      box-shadow: 0 0 0 3px rgba(42, 143, 106, 0.2);
    }
    .geo-panel {
      border-radius: 12px;
      border: 1px dashed rgba(29, 107, 82, 0.35);
      background: rgba(248, 253, 250, 0.9);
      padding: 0.7rem 0.8rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: #2d4a3c;
      line-height: 1.5;
    }
    .geo-panel .status { font-weight: 600; color: #14523d; }
    .geo-panel.warn { border-color: #f59e0b; background: rgba(254, 243, 199, 0.35); color: #78350f; }
    .geo-hint { font-size: 0.72rem; color: #64748b; margin-top: 0.35rem; }
    .geo-addr { font-size: 0.76rem; color: #475569; margin-top: 0.4rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.15rem;
      background: linear-gradient(135deg, #1d6b52 0%, #0f4d3a 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(15, 77, 58, 0.38);
      transition: transform 0.1s, box-shadow 0.15s, filter 0.15s;
    }
    button[type="submit"]:hover { filter: brightness(1.06); }
    button[type="submit"]:active { transform: scale(0.99); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
    .msg { margin-top: 1rem; padding: 0.75rem 0.85rem; border-radius: 12px; font-size: 0.9rem; display: none; line-height: 1.45; }
    .msg.ok { display: block; background: rgba(220, 252, 231, 0.95); color: #14532d; border: 1px solid #86efac; }
    .msg.err { display: block; background: rgba(254, 226, 226, 0.95); color: #7f1d1d; border: 1px solid #fca5a5; }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="card">
      <nav><a href="/stats">签到统计</a> · <a href="/checkin2">开放签到</a> · <a href="/iching">周易抽签</a> · <a href="/lottery">抽奖轮盘</a></nav>
      <div class="brand">
        <div class="pin" aria-hidden="true">📍</div>
        <h1 id="mainHeading">现场签到</h1>
      </div>
      <p class="sub" id="subLine">正在加载签到范围…</p>
      <div class="fence" id="fenceBox">
        <strong>地理围栏</strong>：配置加载中…
      </div>
      <div id="geoPanel" class="geo-panel warn">
        <div class="status" id="geoStatus">正在请求定位权限…</div>
        <div id="geoDetail"></div>
        <div id="geoAddress" class="geo-addr" aria-live="polite"></div>
        <div class="geo-hint" id="geoHintBase">若定位失败：请检查系统与浏览器定位权限；公网访问请使用 <strong>HTTPS</strong>（Chrome 等在 HTTP 下常无法定位）。国内文字地址需在服务器配置 <code>AMAP_WEB_KEY</code>（高德 Web 服务 Key）。</div>
      </div>
      <form id="form">
        <label for="phone">手机号</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="请输入手机号" required />
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="name" placeholder="请输入用户名" required />
        <button type="submit" id="btn" disabled>获取定位后可签到</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
  </div>
  <script>
    (async function () {
      let centerLat = 31.1569;
      let centerLng = 121.4746;
      let radiusKm = 5;
      let venueName = '上海东方体育中心';

      function escapeHtml(s) {
        if (s == null || s === '') return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function fmtRadiusKm(k) {
        if (typeof k !== 'number' || !Number.isFinite(k)) return '5';
        if (Math.abs(k - Math.round(k)) < 1e-6) return String(Math.round(k));
        return k.toFixed(1);
      }

      try {
        const fr = await fetch('/api/checkins/fence');
        if (fr.ok) {
          const j = await fr.json();
          if (typeof j.center_lat === 'number') centerLat = j.center_lat;
          if (typeof j.center_lng === 'number') centerLng = j.center_lng;
          if (typeof j.radius_km === 'number') radiusKm = j.radius_km;
          if (typeof j.venue === 'string' && j.venue.trim()) venueName = j.venue.trim();
        }
      } catch (_) { /* 使用默认 */ }

      document.title = venueName + ' · 现场签到';
      document.getElementById('mainHeading').textContent = venueName + ' · 现场签到';
      document.getElementById('subLine').innerHTML =
        '仅限身在 <strong>' + escapeHtml(venueName) + '</strong> 附近的到场签到';
      document.getElementById('fenceBox').innerHTML =
        '<strong>地理围栏</strong>：以 <strong>' + escapeHtml(venueName) + '</strong> 为中心，半径 <strong>' +
        escapeHtml(fmtRadiusKm(radiusKm)) + '</strong> 公里（WGS84 球面距离）。<br />' +
        '请先允许浏览器获取定位，再提交；服务端将复核距离。';

      function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      }

      const geoPanel = document.getElementById('geoPanel');
      const geoStatus = document.getElementById('geoStatus');
      const geoDetail = document.getElementById('geoDetail');
      const geoAddress = document.getElementById('geoAddress');
      const btn = document.getElementById('btn');
      let pos = null;

      function isInsecureForGeo() {
        try {
          return location.protocol === 'http:' &&
            location.hostname !== 'localhost' &&
            location.hostname !== '127.0.0.1' &&
            location.hostname !== '[::1]';
        } catch (_) { return false; }
      }

      function mapGeoError(e) {
        let base = '';
        switch (e && e.code) {
          case 1:
            base = '已拒绝定位权限，请在浏览器或系统设置中允许本站使用「位置」。';
            break;
          case 2:
            base = '暂时无法确定位置（室内信号弱或未开 GPS 时常见），请到窗边或室外重试。';
            break;
          case 3:
            base = '定位超时，请确认已开启系统定位后重试。';
            break;
          default:
            base = (e && e.message) ? String(e.message) : '未知错误';
        }
        if (isInsecureForGeo()) {
          base += ' 【重要】当前为 HTTP 访问：多数浏览器会禁止非安全上下文定位，请改用 HTTPS 域名打开本页。';
        }
        return '定位失败：' + base;
      }

      async function loadReverseAddress(lat, lng) {
        geoAddress.textContent = '正在解析附近地址…';
        try {
          const ar = await fetch('/api/geo/reverse?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng));
          const aj = await ar.json().catch(() => ({}));
          if (ar.ok && aj.display_name) {
            geoAddress.textContent = '大致位置：' + String(aj.display_name);
          } else if (aj.error) {
            geoAddress.textContent = '文字地址未返回（' + aj.error + '），不影响按坐标签到。';
          } else {
            geoAddress.textContent = '未能解析文字地址，仍可根据坐标签到。';
          }
        } catch (_) {
          geoAddress.textContent = '地址解析请求失败，仍可根据坐标签到。';
        }
      }

      function setReady(lat, lng, acc) {
        pos = { lat, lng };
        const d = haversineKm(lat, lng, centerLat, centerLng);
        const inside = d <= radiusKm + 0.001;
        geoPanel.classList.toggle('warn', !inside);
        geoStatus.textContent = inside
          ? '已在允许范围内，可以签到'
          : ('当前位置超出围栏范围（半径 ' + fmtRadiusKm(radiusKm) + ' km），无法签到');
        let accText = acc != null && Number.isFinite(acc) ? `（精度约 ±${Math.round(acc)} m）` : '';
        geoDetail.textContent = '距「' + venueName + '」中心约 ' + d.toFixed(2) + ' km' + accText;
        btn.disabled = !inside;
        btn.textContent = inside ? '提交签到' : '位置不在围栏内';
        loadReverseAddress(lat, lng);
      }

      function setErr(text) {
        pos = null;
        geoPanel.classList.add('warn');
        geoStatus.textContent = text;
        geoDetail.textContent = '';
        geoAddress.textContent = '';
        btn.disabled = true;
        btn.textContent = '获取定位后可签到';
      }

      function requestLocation() {
        if (!navigator.geolocation) {
          setErr('当前浏览器不支持定位');
          return;
        }
        if (isInsecureForGeo()) {
          geoAddress.textContent = '提示：当前为 HTTP 非安全访问，定位可能被浏览器拦截，请使用 https:// 域名访问。';
        }
        const onOk = (r) => setReady(r.coords.latitude, r.coords.longitude, r.coords.accuracy);
        const onFail = (e) => setErr(mapGeoError(e));
        navigator.geolocation.getCurrentPosition(
          onOk,
          (e) => {
            if (e.code === 2 || e.code === 3) {
              navigator.geolocation.getCurrentPosition(onOk, onFail, {
                enableHighAccuracy: false,
                timeout: 24000,
                maximumAge: 120000
              });
            } else {
              onFail(e);
            }
          },
          { enableHighAccuracy: true, timeout: 28000, maximumAge: 0 }
        );
      }

      requestLocation();

      const form = document.getElementById('form');
      const msg = document.getElementById('msg');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.className = 'msg';
        msg.textContent = '';
        if (!pos) {
          msg.className = 'msg err';
          msg.textContent = '请先完成有效定位';
          return;
        }
        btn.disabled = true;
        try {
          const res = await fetch('/api/checkins', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              phone: document.getElementById('phone').value.trim(),
              username: document.getElementById('username').value.trim(),
              latitude: pos.lat,
              longitude: pos.lng,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            msg.className = 'msg err';
            msg.textContent = data.error || '签到失败';
            btn.disabled = false;
            return;
          }
          msg.className = 'msg ok';
          const dk = data.distance_km != null ? Number(data.distance_km).toFixed(2) : '—';
          msg.textContent = '签到成功！时间：' + (data.signed_at || '') + '；距「' + venueName + '」中心约 ' + dk + ' km';
          document.getElementById('phone').value = '';
          document.getElementById('username').value = '';
        } catch {
          msg.className = 'msg err';
          msg.textContent = '网络错误，请稍后重试';
        } finally {
          if (pos) {
            const d = haversineKm(pos.lat, pos.lng, centerLat, centerLng);
            const inside = d <= radiusKm + 0.001;
            btn.disabled = !inside;
            btn.textContent = inside ? '提交签到' : '位置不在围栏内';
          }
        }
      });
    })();
  </script>
</body>
</html>
