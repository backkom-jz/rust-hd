<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>周易抽签</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Songti SC", "SimSun", serif;
      color: #1c1917;
      background: #110d16 radial-gradient(ellipse 130% 95% at 50% -10%, #38284a 0%, #1a1520 52%, #0d0b12 100%) fixed;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }
    .card {
      width: 100%;
      max-width: 450px;
      padding: 1.6rem 1.25rem 1.35rem;
      border-radius: 20px;
      background: linear-gradient(165deg, rgba(255,252,245,0.98) 0%, rgba(246,241,230,0.99) 100%);
      box-shadow:
        0 24px 58px rgba(0,0,0,0.45),
        0 0 0 1px rgba(180,160,120,0.38) inset;
    }
    nav { margin-bottom: 0.9rem; font-size: 0.84rem; }
    nav a { color: #7c6f64; text-decoration: none; }
    nav a:hover { color: #575279; text-decoration: underline; }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: #292524;
      letter-spacing: 0.12em;
    }
    .sub {
      margin: 0 0 1rem;
      font-size: 0.78rem;
      color: #78716c;
    }
    .oracle {
      border-radius: 14px;
      padding: 0.9rem 0.8rem;
      background: linear-gradient(160deg, rgba(58,39,25,0.06), rgba(100,75,45,0.1));
      border: 1px solid rgba(125,95,55,0.2);
    }
    .tube-stage {
      height: 116px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 0.55rem;
      position: relative;
      overflow: hidden;
    }
    .spark-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }
    .spark {
      position: absolute;
      left: 50%;
      bottom: 56px;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7b0 0%, #f9cf5f 55%, rgba(249, 207, 95, 0.15) 100%);
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(255, 210, 70, 0.75));
    }
    .spark-layer.burst .spark {
      animation: sparkFly 0.56s ease-out forwards;
      animation-delay: var(--delay, 0ms);
    }
    @keyframes sparkFly {
      0% { transform: translate(0, 0) scale(0.55); opacity: 0; }
      12% { opacity: 1; }
      100% {
        transform: translate(var(--dx, 0px), var(--dy, -52px)) scale(0.08);
        opacity: 0;
      }
    }
    .tube {
      width: 84px;
      height: 96px;
      border-radius: 14px 14px 10px 10px;
      background: linear-gradient(180deg, #7a5538 0%, #5a3e2b 48%, #3f2a1f 100%);
      border: 2px solid rgba(59, 34, 18, 0.55);
      box-shadow: 0 10px 18px rgba(50, 25, 12, 0.3);
      position: relative;
      transform-origin: 50% 85%;
    }
    .tube::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 8px;
      height: 10px;
      border-radius: 8px;
      background: rgba(255, 248, 235, 0.22);
    }
    .tube.shaking {
      animation: tubeShake 0.16s ease-in-out infinite;
    }
    @keyframes tubeShake {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-5deg); }
      50% { transform: rotate(4deg); }
      75% { transform: rotate(-3deg); }
    }
    .stick {
      position: absolute;
      bottom: 22px;
      width: 16px;
      height: 82px;
      border-radius: 8px;
      background: linear-gradient(180deg, #f7e7c6 0%, #e7c98d 58%, #d8b273 100%);
      border: 1px solid rgba(105, 74, 38, 0.25);
      color: #69431f;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 6px;
      transform-origin: 50% 100%;
      transform: translateY(56px);
      transition: transform 0.2s ease;
      box-shadow: 0 8px 14px rgba(53, 30, 12, 0.2);
    }
    .stick.out {
      animation: slipOut 0.92s cubic-bezier(.2,.75,.2,1) forwards;
    }
    @keyframes slipOut {
      0% { transform: translateY(56px) rotate(0deg); }
      66% { transform: translateY(-88px) rotate(0deg); }
      78% { transform: translateY(-78px) rotate(2deg); }
      88% { transform: translateY(-85px) rotate(-1.6deg); }
      100% { transform: translateY(-82px) rotate(0.2deg); }
    }
    .draw-btn {
      width: 100%;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      color: #faf8f5;
      background: linear-gradient(135deg, #52453b 0%, #1d1916 100%);
      box-shadow: 0 10px 24px rgba(0,0,0,0.3);
      transition: transform 0.12s, filter 0.15s;
    }
    .draw-btn:hover { filter: brightness(1.08); }
    .draw-btn:active { transform: scale(0.98); }
    .draw-btn:disabled { opacity: 0.7; cursor: wait; }
    .loading {
      margin-top: 0.45rem;
      font-size: 0.74rem;
      color: #8a7a64;
      text-align: center;
      min-height: 1rem;
    }
    .result {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(120,100,80,0.2);
      min-height: 260px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .result.show { opacity: 1; transform: translateY(0); }
    .result.reveal { animation: reveal 0.45s ease; }
    .result.rolling .glyph { animation: shake 0.5s ease infinite; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-1deg); }
      40% { transform: translateX(6px) rotate(1deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    @keyframes reveal {
      0% { transform: perspective(700px) rotateX(-18deg) translateY(10px); opacity: 0.2; }
      100% { transform: perspective(700px) rotateX(0) translateY(0); opacity: 1; }
    }
    .glyph {
      font-size: 4.4rem;
      line-height: 1;
      text-align: center;
      margin-bottom: 0.35rem;
      color: #292524;
      text-shadow: 0 4px 14px rgba(50,30,18,0.15);
    }
    .title-row {
      text-align: center;
      margin-bottom: 0.8rem;
    }
    .title-row .no { font-size: 0.9rem; color: #78716c; margin-bottom: 0.2rem; }
    .title-row .name { font-size: 1.65rem; font-weight: 800; color: #1c1917; letter-spacing: 0.15em; }
    .title-row .py { font-size: 0.75rem; color: #a8a29e; margin-top: 0.25rem; }
    .lines {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      margin: 0 auto;
      max-width: 200px;
    }
    .line {
      width: 100%;
      height: 10px;
      border-radius: 2px;
      background: #1c1917;
      display: flex;
      gap: 14%;
      justify-content: center;
    }
    .line.yin {
      background: transparent;
      gap: 8%;
    }
    .line.yin span {
      flex: 1;
      max-width: 42%;
      height: 100%;
      background: #1c1917;
      border-radius: 2px;
    }
    .exp {
      margin-top: 0.95rem;
      padding: 0.75rem 0.8rem;
      border-radius: 10px;
      background: rgba(120, 96, 60, 0.08);
      border: 1px solid rgba(120, 96, 60, 0.18);
    }
    .exp h3 {
      margin: 0 0 0.35rem;
      font-size: 0.82rem;
      color: #5b4a31;
    }
    .exp p {
      margin: 0;
      font-size: 0.86rem;
      line-height: 1.55;
      color: #3b2f22;
    }
    .adv {
      margin-top: 0.65rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }
    .box {
      border-radius: 10px;
      padding: 0.55rem 0.62rem;
      border: 1px solid rgba(92, 120, 70, 0.25);
      background: rgba(212, 245, 210, 0.38);
    }
    .box h4 {
      margin: 0 0 0.25rem;
      font-size: 0.8rem;
      color: #315e36;
    }
    .box p {
      margin: 0;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #2c4730;
    }
    .box.avoid {
      border-color: rgba(164, 100, 84, 0.25);
      background: rgba(255, 230, 225, 0.45);
    }
    .box.avoid h4 { color: #7f3426; }
    .box.avoid p { color: #633226; }
    .hint {
      margin-top: 0.7rem;
      font-size: 0.72rem;
      color: #a8a29e;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

      39:{exp:"蹇卦示难，慢一点比错一步好。",yi:"绕道、求援、稳步",ji:"硬闯、单打独斗"},

      42:{exp:"益卦主增益，利他反得其利。",yi:"帮助他人、投资成长",ji:"短视、自利过度"},
      43:{exp:"夬卦宜决断，关键时刻当断则断。",yi:"立边界、果决执行",ji:"拖泥带水、优柔寡断"},
      44:{exp:"姤卦遇合，机缘虽来亦须辨真伪。",yi:"把握机会、审慎结盟",ji:"一见即信、冲动合作"},
      45:{exp:"萃卦主聚众，先立公义再聚资源。",yi:"组织协同、凝聚共识",ji:"拉帮结派、空喊口号"},
      46:{exp:"升卦主上升，循序渐进更稳。",yi:"持续精进、稳步上台阶",ji:"跳级冒进、急躁"},
      47:{exp:"困卦示受困，守心守志，困中求通。",yi:"节流、求助、韬光",ji:"抱怨、破罐破摔"},
      48:{exp:"井卦主滋养，维护长期价值系统。",yi:"修基础设施、长期服务",ji:"临时抱佛脚、饮鸩止渴"},
      49:{exp:"革卦主变革，顺时而变且先立新法。",yi:"改革、更新机制",ji:"只破不立、反复横跳"},
      50:{exp:"鼎卦主定器，确立新秩序并养贤。",yi:"建制度、用人才、稳运营",ji:"朝令夕改、轻慢人才"},
      51:{exp:"震卦有惊，动中守正可转危为机。",yi:"快速响应、整队再发",ji:"慌乱失措、过度反应"},
      52:{exp:"艮卦为止，知止才能再进。",yi:"暂停、复盘、守边界",ji:"执拗、过度忙碌"},
      53:{exp:"渐卦重渐进，小步快跑而不乱序。",yi:"长期规划、循序推进",ji:"跨级跳跃、急功近利"},
      54:{exp:"归妹示位不正，先正其位再谋发展。",yi:"厘清角色、守分寸",ji:"越位决策、关系用事"},
      55:{exp:"丰卦盛大，繁盛时更要防衰。",yi:"未雨绸缪、留余地",ji:"狂飙突进、铺张冒进"},

      57:{exp:"巽卦入木，润物细无声。",yi:"耐心沟通、持续渗透",ji:"强压、粗暴推进"},
      58:{exp:"兑卦主悦，和悦能聚人心。",yi:"鼓励、共赢、正向反馈",ji:"口惠而实不至、取悦过度"},
      59:{exp:"涣卦先散后聚，先解心结再聚力。",yi:"化解隔阂、重建信任",ji:"强行统一、压制情绪"},
      60:{exp:"节卦重节制，规则即护城河。",yi:"定边界、控预算、守时",ji:"放纵、无序扩张"},
      61:{exp:"中孚以诚感人，诚信是最强背书。",yi:"守信、坦诚、兑现承诺",ji:"欺瞒、反复无常"},
      62:{exp:"小过宜小事可行，大事宜谨。",yi:"先做小步验证、补细节",ji:"大跨步豪赌、逞强"},

      64:{exp:"未济未成，结尾阶段更要稳。",yi:"耐心收官、分段达成",ji:"临门急躁、半途而废"}
    };

    function renderLines(binStr) {
      const el = document.getElementById('lines');
      el.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const yang = binStr.charAt(i) === '1';
        const row = document.createElement('div');
        row.className = 'line' + (yang ? ' yang' : ' yin');
        if (!yang) {
          row.appendChild(document.createElement('span'));
          row.appendChild(document.createElement('span'));
        }
        el.appendChild(row);
      }
    }

    function meta(no) {
      return META[no] || {
        exp: "守正谨慎，先稳住节奏再行动。",
        yi: "审势、协作、稳步推进",
        ji: "冲动、逞强、失信"
      };
    }

    function show(g, rolling) {
      const [n, cn, bin, sym, py] = g;
      document.getElementById('glyph').textContent = sym;
      document.getElementById('no').textContent = '第 ' + n + ' 卦';
      document.getElementById('name').textContent = cn;
      document.getElementById('py').textContent = py;
      const m = meta(n);
      document.getElementById('exp').textContent = m.exp;
      document.getElementById('yi').textContent = m.yi;
      document.getElementById('ji').textContent = m.ji;
      renderLines(bin);
      const r = document.getElementById('result');
      r.classList.add('show');
      if (!rolling) {
        r.classList.add('reveal');
        setTimeout(() => r.classList.remove('reveal'), 500);
      }
    }

    function randIndex(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        const arr = new Uint32Array(1);
        window.crypto.getRandomValues(arr);
        return arr[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    document.getElementById('draw').addEventListener('click', function () {
      const btn = this;
      const loading = document.getElementById('loading');
      const r = document.getElementById('result');
      const tube = document.getElementById('tube');
      const stick = document.getElementById('stick');
      const sparkLayer = document.getElementById('sparkLayer');
      btn.disabled = true;
      btn.textContent = '摇签中...';
      loading.textContent = '签筒摇动中，请静心片刻...';
      r.classList.remove('show', 'reveal', 'rolling');
      tube.classList.add('shaking');
      stick.classList.remove('out');
      sparkLayer.classList.remove('burst');
      void stick.offsetWidth;

      const i = randIndex(64);
      const picked = GUAS[i];

      setTimeout(() => {
        tube.classList.remove('shaking');
        loading.textContent = '签条抽出中...';
        sparkLayer.classList.remove('burst');
        void sparkLayer.offsetWidth;
        sparkLayer.classList.add('burst');
        stick.classList.add('out');
      }, 850);

      setTimeout(() => {
        show(picked, false);
        btn.disabled = false;
        btn.textContent = '再抽一签';
        loading.textContent = '本签仅供文化体验，请结合现实理性判断。';
      }, 1650);
    });
  </script>
